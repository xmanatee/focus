name: Push App Store Metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-metadata
  cancel-in-progress: false

env:
  EXPO_NO_TELEMETRY: '1'
  DO_NOT_TRACK: '1'
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      APPLE_REVIEW_FIRST_NAME: ${{ secrets.APPLE_REVIEW_FIRST_NAME }}
      APPLE_REVIEW_LAST_NAME: ${{ secrets.APPLE_REVIEW_LAST_NAME }}
      APPLE_REVIEW_EMAIL: ${{ secrets.APPLE_REVIEW_EMAIL }}
      APPLE_REVIEW_PHONE: ${{ secrets.APPLE_REVIEW_PHONE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate metadata
        run: |
          EAS_CLI_VERSION=$(node -p 'require("./eas.json").cli.version')
          npm exec --yes --package "eas-cli@$EAS_CLI_VERSION" -- eas metadata:lint

      - name: Push metadata to App Store Connect
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/run-eas-metadata-push.mjs
